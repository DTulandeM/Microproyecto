apiVersion: apps/v1
kind: Deployment
metadata:
  name: clasificacion-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clasificacion-imagenes
  template:
    metadata:
      labels:
        app: clasificacion-imagenes
    spec:
      containers:
      - name: clasificacion-imagenes
        image: acrmicroproyecto2davinson.azurecr.io/clasificacion-imagenes:v1
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: clasificacion-service
spec:
  type: LoadBalancer
  selector:
    app: clasificacion-imagenes
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
